<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>حضور الأدمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f2; --card:#ffffff; --fg:#14201a; --muted:#5f6f66;
    --green:#1fa855; --green-d:#168a45; --line:#dfe5e0; --off:#b9c3bd; --warn:#c0392b; --chip:#eef2ef;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1512; --card:#17211c; --fg:#e8efe9; --muted:#93a39a;
           --green:#25c063; --green-d:#1fa855; --line:#26332c; --off:#3d4a43; --warn:#ff7a6b; --chip:#1f2b25; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:'Cairo',Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:22px;font-weight:800;margin:0}
  .sub{color:var(--muted);margin:0;font-size:14px;line-height:1.7}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    display:flex;flex-direction:column;gap:10px}
  .card.on{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .name{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;min-width:0}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--off);flex:none}
  .on .dot{background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}
  .seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px;flex:none}
  .seg button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 12px;
    font:700 14px 'Cairo',Tahoma,sans-serif;cursor:pointer;white-space:nowrap}
  .seg button.act-on{background:var(--green);color:#fff}
  .seg button.act-off{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .seg button:disabled{opacity:.6;cursor:wait}
  .note{display:flex;gap:8px}
  .note input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--fg);font:400 15px 'Cairo',Tahoma,sans-serif}
  .note button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;
    padding:0 14px;font:700 14px 'Cairo',Tahoma,sans-serif;cursor:pointer}
  .meta{font-size:12.5px;color:var(--muted);margin:0;min-height:1.2em}
  .msg{text-align:center;padding:14px;color:var(--muted)}
  .err{color:var(--warn)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>حضور الأدمن</h1>
    <p class="sub">اختار متاح أو مش متاح. اللي متاح بيظهر للعملاء ويتحولوا على الواتس بتاعه. الملاحظة اختيارية وبتظهر للعملاء لما الأدمن يبقى مش متاح.</p>
  </div>
  <div id="list"><div class="card msg">جاري التحميل…</div></div>
</div>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbzVvci1ohUKR52_yxdEnQkutybpEx5whs2zgM1POQEQd1_REuT1nbsalxr8UHTURDT6/exec';
  var KEY = decodeURIComponent((location.hash || '').slice(1));
  var editing = {};

  function call(params){
    var q = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(API + '?' + q + '&key=' + encodeURIComponent(KEY) + '&t=' + Date.now(),
                 { credentials: 'omit', cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d.error) throw new Error(d.error); return d; });
  }
  function hhmm(t){ return new Date(t).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render(d){
    var box = document.getElementById('list'); box.innerHTML = '';
    d.admins.forEach(function(a){
      var c = el('div', 'card' + (a.on ? ' on' : ''));
      var top = el('div', 'top');
      var nm = el('div', 'name'); nm.appendChild(el('span', 'dot')); nm.appendChild(el('span', '', a.name));
      var seg = el('div', 'seg');
      var bOn = el('button', a.on ? 'act-on' : '', 'متاح');
      var bOff = el('button', a.on ? '' : 'act-off', 'مش متاح');
      bOn.type = bOff.type = 'button';
      bOn.onclick = function(){ if (!a.on) set(a.id, {on: '1'}, [bOn, bOff]); };
      bOff.onclick = function(){ if (a.on) set(a.id, {on: '0'}, [bOn, bOff]); };
      seg.appendChild(bOn); seg.appendChild(bOff);
      top.appendChild(nm); top.appendChild(seg);

      var nt = el('div', 'note');
      var inp = el('input'); inp.id = 'note-' + a.id; inp.maxLength = 80;
      inp.placeholder = 'هيبقى متاح إمتى؟ (اختياري) مثلًا: الساعة 10 بالليل';
      inp.value = (editing[a.id] != null) ? editing[a.id] : a.note;
      inp.oninput = function(){ editing[a.id] = inp.value; };
      var save = el('button', '', 'حفظ'); save.type = 'button';
      save.onclick = function(){ set(a.id, {note: inp.value}, [save]).then(function(){ delete editing[a.id]; }); };
      inp.onkeydown = function(e){ if (e.key === 'Enter') save.click(); };
      nt.appendChild(inp); nt.appendChild(save);

      var meta = el('p', 'meta', a.on ? ('متاح من ' + hhmm(a.since) + ' — بيتقفل لوحده الساعة ' + hhmm(a.offAt)) : '');
      c.appendChild(top); c.appendChild(nt); c.appendChild(meta);
      box.appendChild(c);
    });
  }

  function fail(e){
    var box = document.getElementById('list');
    var msg = (e && e.message === 'bad_key') ? 'الرابط ده ناقص أو غلط. افتح رابط الأدمن كامل.' : 'حصلت مشكلة في الاتصال، اعمل تحديث للصفحة.';
    box.innerHTML = ''; box.appendChild(el('div', 'card msg err', msg));
  }

  function set(id, extra, btns){
    btns.forEach(function(b){ b.disabled = true; });
    var p = {set: '', id: id}; Object.keys(extra).forEach(function(k){ p[k] = extra[k]; });
    return call(p).then(render).catch(function(e){
      btns.forEach(function(b){ b.disabled = false; });
      alertish();
    });
  }
  function alertish(){
    var box = document.getElementById('list');
    var m = el('div', 'card msg err', 'محصلش حفظ، جرب تاني.'); box.insertBefore(m, box.firstChild);
    setTimeout(function(){ m.remove(); }, 3000);
  }
  function load(){ call({all: ''}).then(render).catch(fail); }

  if (!KEY) fail({message: 'bad_key'}); else load();
  setInterval(function(){ if (KEY && !document.activeElement.matches('input')) load(); }, 60000);
</script>
</body>
</html>
